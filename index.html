<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.css" rel="stylesheet"/>
<link rel="stylesheet" href="./Css/main.css">
    <title>CMS Dashboard</title>
</head>
<body>
    <nav id="sidebar">
       <ul>
        <div class="logo">
            <img src="./images/Group 11 (1).png" alt="logo" >
            <span>Company name</span>
        </div>
        <li class="active">
            <span>Dashboard</span>
        </li>
        <li>
            <span>User Management</span>
        </li>
        <li>
            <span>Documents</span>
        </li>
         <li>
            <span>Statistics</span>
        </li>
         <li>
            <span>Settings</span>
        </li>
       </ul>
       <button id="logout">
        Logout
       </button>
    </nav>
    <div class="container">
         <nav id="top-navigation">
        
            <div  id="item1">
                <span>Dashboard overview</span>
                <span class="search-background">
                     <i class="fa fa-search search-icon"></i>
                    <input type="text" placeholder=" Search all..."  >
                </span>
            </div>
            
            <div id="item2">
                <span>Help guides</span>
                <span>
                    Inbox
                    <span class="icon-box">
                         <i class="fa fa-image item2-img"></i>
                        <i class="fa fa-circle circle"></i>
                     </span>
                </span>
                <span>
                    <button class="nav-btn">Download Client</button>
                </span>
                <span class="avatar-wrapper">
                    <img src="./images/image 1.png" alt="avatar" class="profile-img">
                    <i id="profile-status"></i>
                </span>
            </div>

        
    </nav>
    <div class="table-content">
        <h1>table</h1>
    </div>
    </div>
